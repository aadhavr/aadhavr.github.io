project:
  type: website
  output-dir: docs
  resources:
    - CNAME          # keeps the custom domain across republishes

website:
  title: "Aadhav Rajesh"
  favicon: profile.jpg
  description: "Notes on measurement in the economics of AI."
  site-url: https://www.aadhavrajesh.com
  navbar:
    right:
      - text: Writing
        href: writing.qmd
      - text: CV
        href: cv.pdf
      - icon: github
        href: https://github.com/aadhavr
  page-footer:
    left: "&copy; 2026 Aadhav Rajesh"
    right: "[Source](https://github.com/aadhavr/aadhavr.github.io)"

format:
  html:
    theme: custom.scss
    toc: true
    toc-depth: 2
    toc-title: "On this page"
    code-copy: true
    fig-cap-location: bottom
    link-external-newwindow: true
    anchor-sections: true
    smooth-scroll: false
    citations-hover: true
    footnotes-hover: true
    grid:
      body-width: 690px
      sidebar-width: 200px
      margin-width: 180px

execute:
  freeze: auto
  echo: false
  warning: false